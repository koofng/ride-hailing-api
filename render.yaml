# Render Blueprint: the API (Docker, free web service) and its Postgres
# database. Uploaded files go to MongoDB Atlas (GridFS), because a free web
# service's disk is wiped on every deploy and restart.
# Set up with: Render Dashboard -> New -> Blueprint -> this repository.
# See "Deploying to Render" in README.md.

databases:
  - name: ride-hailing-db
    plan: free # deleted by Render after 30 days; upgrade to keep the data
    region: virginia
    databaseName: ride_hailing
    user: ride_hailing
    postgresMajorVersion: '17'

services:
  - type: web
    name: ride-hailing-api
    runtime: docker
    plan: free # sleeps after 15 minutes without traffic
    region: virginia
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection, filled in from the database above.
      - key: DB_HOST
        fromDatabase:
          name: ride-hailing-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ride-hailing-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: ride-hailing-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ride-hailing-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ride-hailing-db
          property: database
      # A random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: '12'
      # Uploads in MongoDB Atlas. MONGODB_URI is entered in the dashboard
      # when the Blueprint is created; it is never stored in this file.
      - key: STORAGE_DRIVER
        value: gridfs
      - key: MONGODB_URI
        sync: false
      # PORT and RENDER_EXTERNAL_URL (used for photo links) are set by Render.
